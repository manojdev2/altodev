version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - UV Charging/.env
    environment:
      - PORT=5001
    volumes:
      - ./UV Charging/uploads:/app/uploads
    expose:
      - "5001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
      - BACKEND_ORIGIN=http://backend:5001
    depends_on:
      - backend
    expose:
      - "3000"

  proxy:
    image: nginx:1.25-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
